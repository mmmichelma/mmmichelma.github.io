name: Burgenduell APK

on:
  push:
    paths:
      - 'burgenduell/**'
      - 'burgenduell-android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        run: gradle -p burgenduell-android assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp burgenduell-android/app/build/outputs/apk/debug/app-debug.apk burgenduell.apk
      - uses: actions/upload-artifact@v4
        with:
          name: burgenduell-apk
          path: burgenduell.apk
