name: Bucket-List APK

on:
  push:
    paths:
      - 'bucketlist-android/**'
      - '.github/workflows/bucketlist-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bucketlist-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        run: gradle -p bucketlist-android assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp bucketlist-android/app/build/outputs/apk/debug/app-debug.apk BucketList.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bucketlist-apk
          path: BucketList.apk
      # Direkter Download-Link fürs Handy (GitHub Release "bucketlist")
      - name: APK als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bucketlist --yes --cleanup-tag || true
          gh release create bucketlist BucketList.apk --target "${{ github.sha }}" \
            --title "Bucket-List App" --notes "Marc & Luna Bucket-List – APK zum Installieren" --prerelease
