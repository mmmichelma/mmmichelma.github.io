plugins {
    id 'com.android.application'
}

android {
    namespace 'de.mmmichelma.burgenduell'
    compileSdk 34

    defaultConfig {
        applicationId 'de.mmmichelma.burgenduell'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The game itself (index.html, icons) is taken straight from the website folder.
    sourceSets {
        main {
            assets.srcDirs = ['../../burgenduell']
        }
    }
}
